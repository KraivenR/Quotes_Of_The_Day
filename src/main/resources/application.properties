# H2 Application Info
spring.application.name=Quotes-Of-The-Day
# H2 Server port
server.port=8080
# H2 Database (for now)
spring.datasource.url=jdbc::postgresql://localhost:5432/your_project_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=21savage
spring.datasource.driver-class-name=org.postgresql.Driver
# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=auto
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Disable security for now
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
